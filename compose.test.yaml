name: ordermanagement-test

services:
  sqlserver-test:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Ephemeral, network-isolated test container - never exposed on a host port or persisted.
      MSSQL_SA_PASSWORD: Test@1234!
      # SQL Server otherwise claims up to 80% of memory it detects on the host - wasteful and
      # a common cause of memory pressure on constrained CI agents/dev machines for a small test DB.
      MSSQL_MEMORY_LIMIT_MB: "2048"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - ordermanagement-test

  database-init-test:
    build:
      context: .
      target: runtime
    # "docker compose up --abort-on-container-exit" (the mandated test command, see README)
    # aborts the whole stack the moment ANY container exits - including a one-shot init
    # container that exits 0 by design. To avoid that, this container signals completion
    # through a healthcheck instead of exiting: on success it stays alive (app-test depends
    # on it becoming "healthy"); on failure it exits non-zero immediately, which correctly
    # aborts the stack with a clear failure.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        dotnet OrderManagement.Presentation.Blazor.dll initialize-database
        status=$$?
        if [ $$status -ne 0 ]; then
          exit $$status
        fi
        touch /tmp/database-init-complete
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/database-init-complete"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s
    depends_on:
      sqlserver-test:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderManagement: Server=sqlserver-test,1433;Database=OrderManagementE2E;User Id=sa;Password=Test@1234!;TrustServerCertificate=True;
      DatabaseInitialization__SeedDemoData: "false"
    networks:
      - ordermanagement-test

  app-test:
    build:
      context: .
      target: runtime
    depends_on:
      database-init-test:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderManagement: Server=sqlserver-test,1433;Database=OrderManagementE2E;User Id=sa;Password=Test@1234!;TrustServerCertificate=True;
      # Fixed clock so Playwright browser scenarios see a deterministic "today" -
      # matches PlaywrightSeedData.ReferenceNow used to seed OrderManagementE2E below.
      Testing__FixedUtcNow: "2026-06-15T12:00:00Z"
    networks:
      - ordermanagement-test

  tests:
    build:
      context: .
      target: test-runner
    depends_on:
      database-init-test:
        condition: service_healthy
      app-test:
        condition: service_started
    environment:
      ORDERMANAGEMENT_TEST_SQLSERVER: Server=sqlserver-test,1433;User Id=sa;Password=Test@1234!;TrustServerCertificate=True;
      PLAYWRIGHT_BASE_URL: http://app-test:8080
      PLAYWRIGHT_CONNECTION_STRING: Server=sqlserver-test,1433;Database=OrderManagementE2E;User Id=sa;Password=Test@1234!;TrustServerCertificate=True;
      # Resolved by Compose itself (at "docker compose up" time, on the host) so an unset
      # TEST_PROJECTS falls back to the full solution - CI overrides it in the invoking shell
      # to scope a run to a subset of projects (e.g. just the Playwright E2E project).
      TEST_PROJECTS: ${TEST_PROJECTS:-OrderManagement.sln}
    init: true
    ipc: host
    networks:
      - ordermanagement-test

networks:
  ordermanagement-test:
