trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - 'Abgabe_*'

pr: none

pool:
  vmImage: ubuntu-24.04

variables:
- group: github-secret-Public-Repository

- name: githubRepo
  value: zbw-online/it27.sw.group05

steps:
- checkout: self
  clean: true
  fetchDepth: 0
  fetchTags: true
  persistCredentials: true

- script: |
    set -euo pipefail

    SOURCE_BRANCH="$(Build.SourceBranch)"
    PREFIX="refs/tags/"

    if [[ "$SOURCE_BRANCH" != "$PREFIX"* ]]; then
      echo "##vso[task.logissue type=error]This pipeline must be triggered by a tag (refs/tags/...), not by '$SOURCE_BRANCH'."
      exit 1
    fi

    TAG_NAME="${SOURCE_BRANCH#"$PREFIX"}"

    if [[ ! "$TAG_NAME" =~ ^Abgabe_[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
      echo "##vso[task.logissue type=error]Tag '$TAG_NAME' does not match the required release tag pattern '^Abgabe_[A-Za-z0-9][A-Za-z0-9._-]*\$'."
      exit 1
    fi

    echo "Tag name validated: $TAG_NAME"
    echo "##vso[task.setvariable variable=tagName]$TAG_NAME"
  displayName: Validate Abgabe_* tag name

- script: |
    set -euo pipefail

    TAG_NAME="$(tagName)"
    TAG_COMMIT="$(git rev-list -n 1 "$TAG_NAME")"

    if [ -z "$TAG_COMMIT" ]; then
      echo "##vso[task.logissue type=error]Could not resolve a commit for tag '$TAG_NAME'."
      exit 1
    fi

    echo "Tag '$TAG_NAME' points to commit $TAG_COMMIT"

    git fetch origin main

    if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
      echo "##vso[task.logissue type=error]Commit $TAG_COMMIT for tag '$TAG_NAME' is not part of the history of origin/main."
      exit 1
    fi

    echo "Confirmed: tag '$TAG_NAME' points to a commit in the history of origin/main."
  displayName: Verify tag commit is on main

- script: |
    set -euo pipefail

    TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
    if [ -z "$TOKEN" ]; then
      echo "##vso[task.logissue type=error]No GitHub token available. Check the github-secret-Public-Repository variable group and pipeline permissions."
      exit 1
    fi
    export GH_TOKEN="$TOKEN"
    export GITHUB_TOKEN="$TOKEN"

    TAG_NAME="$(tagName)"
    GH_REPO="$(githubRepo)"

    if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
      echo "A GitHub Release for tag '$TAG_NAME' already exists. Skipping creation."
      exit 0
    fi

    gh release create "$TAG_NAME" \
      --repo "$GH_REPO" \
      --title "OrderManagement – $TAG_NAME" \
      --verify-tag \
      --generate-notes

    echo "Created GitHub Release for tag '$TAG_NAME'."
  displayName: Create GitHub Release (idempotent)
  env:
    GH_TOKEN: $(GITHUB_TOKEN)
    GITHUB_TOKEN: $(GITHUB_TOKEN)
