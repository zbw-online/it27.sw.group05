trigger:
  branches:
    include:
      - feature/*
      - Feature*

pr:
  branches:
    include:
      - Develop

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

- task: UseDotNet@2
  displayName: 'Install .NET 9 SDK'
  inputs:
    packageType: sdk
    version: 9.x

- script: dotnet restore
  displayName: Restore

- script: dotnet test --configuration Release --no-restore
  displayName: Run tests
