trigger:
  branches:
    include:
      - feature/*
      - Feature*
      - Develop
      - main

pr:
  branches:
    include:
      - Develop
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'

stages:

# --- Stage 0: enforce feature -> Develop -> main workflow on PRs into main ---
- stage: ValidateBranchWorkflow
  displayName: 'Validate branch workflow'
  jobs:
  - job: CheckSourceBranch
    steps:
    - script: |
        set -euo pipefail

        if [ "$(Build.Reason)" != "PullRequest" ]; then
          echo "Not a PR build, skipping."
          exit 0
        fi

        TARGET="$(System.PullRequest.TargetBranch)"
        SOURCE="$(System.PullRequest.SourceBranch)"
        echo "PR target: $TARGET"
        echo "PR source: $SOURCE"

        if [ "$TARGET" = "refs/heads/main" ] && [ "$SOURCE" != "refs/heads/Develop" ]; then
          if [ "$(AllowNonDevelopSourceForMain)" != "true" ]; then
            echo "##vso[task.logissue type=error]PRs into main must come from Develop. Set the AllowNonDevelopSourceForMain pipeline variable to 'true' for an authorised release/hotfix exception."
            exit 1
          fi
          echo "##vso[task.logissue type=warning]Non-Develop source branch into main allowed via explicit AllowNonDevelopSourceForMain override."
        fi
      displayName: 'Enforce Develop -> main workflow'

# --- Stage 1: restore and build ---
- stage: RestoreAndBuild
  displayName: '1. Restore and build'
  dependsOn: ValidateBranchWorkflow
  jobs:
  - job: Build
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
        packageType: sdk
        version: '8.0.x'
    - task: UseDotNet@2
      displayName: Install .NET 9 SDK
      inputs:
        packageType: sdk
        version: '9.x'
    - script: dotnet restore
      displayName: Restore
    - script: dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: Build

# --- Stage 2: format verification ---
- stage: FormatVerification
  displayName: '2. Format verification'
  dependsOn: RestoreAndBuild
  jobs:
  - job: Format
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 9.x
    - script: dotnet restore
      displayName: Restore
    - script: dotnet format --verify-no-changes
      displayName: Verify formatting

# --- Stage 3: unit and bUnit tests (no external dependencies) ---
- stage: UnitAndComponentTests
  displayName: '3. Unit and bUnit tests'
  dependsOn: RestoreAndBuild
  jobs:
  - job: Test
    steps:
    - template: templates/dotnet-test-with-coverage.yml
      parameters:
        displayName: 'Run unit and bUnit tests'
        projects: 'tests/SharedKernel.Tests/SharedKernel.Tests.csproj tests/OrderManagement.Domain.Tests/OrderManagement.Domain.Tests.csproj tests/OrderManagement.Application.Tests/OrderManagement.Application.Tests.csproj tests/OrderManagement.Presentation.Blazor.Tests/OrderManagement.Presentation.Blazor.Tests.csproj'
        buildConfiguration: $(buildConfiguration)
        coverageArtifactName: 'coverage-unit'
        testResultsTitle: 'UnitAndComponentTests'

# --- Stage 4: SQL Server integration tests (Testcontainers; Docker is available on the hosted ubuntu-latest agent) ---
- stage: SqlServerIntegrationTests
  displayName: '4. SQL Server integration tests'
  dependsOn: RestoreAndBuild
  jobs:
  - job: Test
    steps:
    - template: templates/dotnet-test-with-coverage.yml
      parameters:
        displayName: 'Run SQL Server integration tests'
        projects: 'tests/OrderManagement.Infrastructure.IntegrationTests/OrderManagement.Infrastructure.IntegrationTests.csproj'
        buildConfiguration: $(buildConfiguration)
        coverageArtifactName: 'coverage-integration'
        testResultsTitle: 'SqlServerIntegrationTests'

# --- Stage 5: Reqnroll acceptance tests (Testcontainers) ---
- stage: AcceptanceTests
  displayName: '5. Reqnroll acceptance tests'
  dependsOn: RestoreAndBuild
  jobs:
  - job: Test
    steps:
    - template: templates/dotnet-test-with-coverage.yml
      parameters:
        displayName: 'Run Reqnroll acceptance tests'
        projects: 'tests/OrderManagement.AcceptanceTests/OrderManagement.AcceptanceTests.csproj'
        buildConfiguration: $(buildConfiguration)
        coverageArtifactName: 'coverage-acceptance'
        testResultsTitle: 'AcceptanceTests'

# --- Stage 6: Playwright critical-path tests (boots the real app; not part of line-coverage collection) ---
- stage: PlaywrightTests
  displayName: '6. Playwright critical-path tests'
  dependsOn: RestoreAndBuild
  jobs:
  - job: Test
    steps:
    - checkout: self
      clean: true
    - task: UseDotNet@2
      displayName: Install .NET 8 SDK
      inputs:
        packageType: sdk
        version: '8.0.x'
    - task: UseDotNet@2
      displayName: Install .NET 9 SDK
      inputs:
        packageType: sdk
        version: '9.x'
    - script: dotnet restore
      displayName: Restore
    - script: dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: Build
    - script: pwsh tests/OrderManagement.PlaywrightTests/bin/$(buildConfiguration)/net8.0/playwright.ps1 install --with-deps chromium
      displayName: Install Playwright browser
    - script: dotnet test tests/OrderManagement.PlaywrightTests/OrderManagement.PlaywrightTests.csproj --configuration $(buildConfiguration) --no-build --logger trx --results-directory "$(Agent.TempDirectory)/trx"
      displayName: Run Playwright tests
      env:
        PLAYWRIGHT_APP_CONFIGURATION: $(buildConfiguration)
    - task: PublishTestResults@2
      displayName: Publish Playwright TRX results
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)/trx/*.trx'
        testRunTitle: PlaywrightTests
    - task: PublishPipelineArtifact@1
      displayName: Publish Playwright traces/screenshots (failure only)
      condition: failed()
      inputs:
        targetPath: '$(Agent.TempDirectory)/trx'
        artifact: 'PlaywrightFailureArtifacts'
        publishLocation: pipeline

# --- Stage 7 & 8: coverage generation and threshold enforcement ---
- stage: Coverage
  displayName: '7-8. Coverage generation and threshold enforcement'
  dependsOn:
  - UnitAndComponentTests
  - SqlServerIntegrationTests
  - AcceptanceTests
  condition: succeededOrFailed()
  jobs:
  - job: Coverage
    steps:
    - checkout: none
    - task: DownloadPipelineArtifact@2
      displayName: Download coverage-unit
      inputs:
        artifact: coverage-unit
        path: '$(Agent.TempDirectory)/coverage/unit'
    - task: DownloadPipelineArtifact@2
      displayName: Download coverage-integration
      inputs:
        artifact: coverage-integration
        path: '$(Agent.TempDirectory)/coverage/integration'
    - task: DownloadPipelineArtifact@2
      displayName: Download coverage-acceptance
      inputs:
        artifact: coverage-acceptance
        path: '$(Agent.TempDirectory)/coverage/acceptance'
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 9.x
    - script: dotnet tool install --global dotnet-reportgenerator-globaltool
      displayName: Install ReportGenerator
    - script: |
        reportgenerator \
          "-reports:$(Agent.TempDirectory)/coverage/**/coverage.cobertura.xml" \
          "-targetdir:$(Build.ArtifactStagingDirectory)/coverage-report" \
          "-reporttypes:Html;TextSummary;Cobertura"
      displayName: Generate coverage report
    - task: PublishPipelineArtifact@1
      displayName: Publish coverage report
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/coverage-report'
        artifact: CoverageReport
        publishLocation: pipeline
    - script: |
        set -euo pipefail

        SUMMARY="$(Build.ArtifactStagingDirectory)/coverage-report/Summary.txt"

        if [ ! -f "$SUMMARY" ]; then
          echo "##vso[task.logissue type=error]Coverage summary was not generated."
          exit 1
        fi

        cat "$SUMMARY"

        LINE_COVERAGE="$(
          grep -m1 "Line coverage:" "$SUMMARY" |
          grep -oE "[0-9]+(\.[0-9]+)?" |
          head -1
        )"

        if [ -z "$LINE_COVERAGE" ]; then
          echo "##vso[task.logissue type=error]Could not read line coverage from Summary.txt."
          exit 1
        fi

        THRESHOLD=50

        echo "Line coverage: ${LINE_COVERAGE}% (required: ${THRESHOLD}%)"

        if awk -v coverage="$LINE_COVERAGE" -v minimum="$THRESHOLD" \
          'BEGIN { exit !(coverage < minimum) }'
        then
          echo "##vso[task.logissue type=error]Line coverage ${LINE_COVERAGE}% is below the required ${THRESHOLD}% minimum."
          exit 1
        fi

        echo "Coverage requirement passed."
      displayName: Enforce minimum coverage threshold
