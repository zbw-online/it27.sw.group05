parameters:
- name: displayName
  type: string
- name: projects
  type: string
- name: buildConfiguration
  type: string
- name: coverageArtifactName
  type: string
- name: testResultsTitle
  type: string

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: Install .NET 10 SDK
  inputs:
    packageType: sdk
    version: '10.x'

- script: dotnet restore
  displayName: Restore

- script: |
    set -uo pipefail

    failed=0
    for project in ${{ parameters.projects }}; do
      echo "=== dotnet test $project ==="
      dotnet test "$project" \
        --configuration ${{ parameters.buildConfiguration }} \
        --no-restore \
        --settings coverage.runsettings \
        --collect:"XPlat Code Coverage" \
        --logger trx \
        --results-directory "$(Agent.TempDirectory)/testresults" || failed=1
    done

    exit $failed
  displayName: ${{ parameters.displayName }}

- task: PublishTestResults@2
  displayName: Publish TRX results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/testresults/**/*.trx'
    testRunTitle: ${{ parameters.testResultsTitle }}

- task: PublishPipelineArtifact@1
  displayName: Publish coverage artifact
  condition: succeededOrFailed()
  inputs:
    targetPath: '$(Agent.TempDirectory)/testresults'
    artifact: ${{ parameters.coverageArtifactName }}
    publishLocation: pipeline
